<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunisia Tourism - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>Tunisia Tourism</h2>
            <p class="subtitle">Sign in to your account</p>
            
            <div class="alert-container" id="alertContainer"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" id="loginButton">Login</button>
                </div>
            </form>
            <div class="form-footer">
                <a href="signup.html" id="registerLink">Create an account</a>
               
               
            </div>
            <div class="form-footer">
                <a href="forgot-password.html" id="registerLink">forgot password?</a>
            </div>
            <div class="form-footer">
                <a href="index.html" id="registerLink">Go back</a>
               
            </div>
             
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="js/login.js"></script>
</body>
</html>
