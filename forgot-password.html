<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunisia Tourism - Forgot Password</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>Tunisia Tourism</h2>
            <p class="subtitle">Reset your password</p>
            
            <div class="alert-container" id="alertContainer"></div>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email address" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" id="resetButton">Send Reset Link</button>
                </div>
            </form>
            
            <div class="form-footer">
                Remember your password? <a href="login.html" id="loginLink">Login</a>
                <br>
                Don't have an account? <a href="signup.html" id="signupLink">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script src="js/forgot-password.js"></script>
</body>
</html>
